name: StockFlow build and SQL integration
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: StockFlow_CI_Only!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StockFlow_CI_Only!2026' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      STOCKFLOW_TEST_CONNECTION: Server=localhost,1433;User ID=sa;Password=StockFlow_CI_Only!2026;Encrypt=true;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Csharp2.sln
      - run: dotnet build Csharp2.sln --configuration Release --no-restore
      - run: dotnet test Csharp2.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-integration-results
          path: TestResults/*.trx
